<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공간 3D 만들기</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header id="toolbar">
  <strong class="brand">공간 3D 만들기</strong>

  <div class="group" role="group" aria-label="도구">
    <button id="tool-select" class="on" title="물체를 눌러 선택하고, 선택한 물체를 끌어서 옮깁니다 (Esc)">선택·이동</button>
    <button id="tool-wall" title="바닥을 두 번 눌러 벽을 그립니다. 이어서 계속 그릴 수 있고 Esc로 끝냅니다 (W)">벽 그리기</button>
  </div>

  <div class="group" role="group" aria-label="추가">
    <span class="label">추가</span>
    <button data-add="wall">벽</button>
    <button data-add="door" title="선택한 벽(없으면 가장 가까운 벽)에 문을 냅니다">문</button>
    <button data-add="window" title="선택한 벽(없으면 가장 가까운 벽)에 창문을 냅니다">창문</button>
    <button data-add="floor">바닥</button>
    <button data-add="box">상자</button>
    <button data-add="cylinder">원기둥</button>
  </div>

  <div class="group" role="group" aria-label="보기">
    <span class="label">보기</span>
    <button id="view-3d">입체</button>
    <button id="view-top">위에서</button>
  </div>

  <div class="group">
    <label class="label" for="snap">격자 맞춤</label>
    <select id="snap">
      <option value="0">끔</option>
      <option value="0.05">5 cm</option>
      <option value="0.1" selected>10 cm</option>
      <option value="0.5">50 cm</option>
      <option value="1">1 m</option>
    </select>
  </div>

  <div class="group">
    <label class="check" title="켜면 두 손가락 쓸기로 화면을 돌리고, 벌리기/오므리기로 확대·축소합니다. 마우스 휠을 쓸 때는 끄세요.">
      <input type="checkbox" id="trackpad"> 트랙패드
    </label>
  </div>

  <div class="group">
    <button id="undo">되돌리기</button>
    <button id="redo">다시 실행</button>
  </div>

  <div class="group">
    <button id="sample">예시 방</button>
    <button id="gallery" title="다섯 전시관 공간: 빈 전시판 26곳, 트리 2그루, 이동식 화면 3대, 이야기 자리">전시 공간</button>
    <button id="exhibits" title="전시 「스무 개의 질문」의 글과 그림을 전시판에 입힙니다. 다시 누르면 뺍니다.">전시 자료 배치</button>
    <button id="export" title="지금 공간을 파일로 저장합니다">파일로 저장</button>
    <button id="import" title="저장한 파일을 불러옵니다">불러오기</button>
    <button id="clear" class="danger">모두 지우기</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="hint"></div>
  </div>

  <aside id="panel">
    <section id="props">
      <h2>선택한 물체</h2>
      <p id="no-sel" class="muted">물체를 누르면 여기에서 크기·위치·색을 바꿀 수 있습니다.</p>
      <form id="form" hidden autocomplete="off">
        <label class="row wide">이름 <input id="f-name" type="text"></label>

        <h3>크기 (m)</h3>
        <div class="grid3">
          <label>가로 <input id="f-w" type="number" step="0.1" min="0.01"></label>
          <label>세로 <input id="f-d" type="number" step="0.1" min="0.01"></label>
          <label>높이 <input id="f-h" type="number" step="0.1" min="0.01"></label>
        </div>

        <h3>위치 (m)</h3>
        <div class="grid3">
          <label>좌우 <input id="f-x" type="number" step="0.1"></label>
          <label>앞뒤 <input id="f-z" type="number" step="0.1"></label>
          <label>바닥에서 <input id="f-y" type="number" step="0.1"></label>
        </div>

        <h3>회전</h3>
        <div class="row">
          <input id="f-rot" type="number" step="5" aria-label="회전 각도"> <span>도</span>
          <button type="button" id="rot90">90도 돌리기</button>
        </div>

        <h3>색</h3>
        <div class="row">
          <input id="f-color" type="color" aria-label="색">
          <div id="swatches"></div>
        </div>
        <label class="row wide">투명도
          <input id="f-opacity" type="range" min="0.1" max="1" step="0.05">
        </label>

        <p id="group-row" class="row" hidden>
          <span id="group-label" class="muted"></span>
          <button type="button" id="ungroup">묶음 풀기</button>
        </p>

        <div class="row actions">
          <button type="button" id="dup">복제</button>
          <button type="button" id="del" class="danger">삭제</button>
        </div>
      </form>
    </section>

    <section>
      <h2>물체 목록 <span id="count" class="muted"></span></h2>
      <ul id="list"></ul>
    </section>
  </aside>
</main>

<script src="vendor/three.bundle.js?v=170"></script>
<script src="posters.js?v=2"></script>
<script src="app.js?v=6"></script>
</body>
</html>
